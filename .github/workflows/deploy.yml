name: deploy

# Deploys the pages in redirect/ to GitHub Pages. nathanschepers.ca serves them.

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "redirect/"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: build-and-deploy

# nathanschepers.ca redirects to pipe23.org. This workflow deploys the two pages in
# redirect/. The résumé source in src/ and its build script in bin/ are kept. The tag
# resume-2026-11-18 has the workflow that builds and deploys the résumé.

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "redirect/"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
